version: 2
project_name: cvewatch
builds:
  - id: cvewatch
    dir: app
    main: ./src/cmd/cvewatch
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    files: [README.md, docs/**/*, app/config/**/*, app/sources/**/*]
checksum:
  name_template: checksums.txt
changelog:
  use: github
