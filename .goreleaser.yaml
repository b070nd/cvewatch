version: 2
project_name: cvewatch
builds:
  - id: cvewatch
    dir: app
    main: ./src/cmd/cvewatch
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: cvewatch-tui
    dir: app
    main: ./src/cmd/cvewatch-tui
    binary: cvewatch-tui
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md, docs/**/*, skills/**/*]
checksum:
  name_template: checksums.txt
changelog:
  use: github
