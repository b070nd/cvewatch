# Global settings. Every key is optional; these are the defaults.
interval: 4h        # how often a project is refreshed unless its file says otherwise
lookback: 168h      # first run of a source reaches this far back
retention: 4320h    # forget items that matched nothing after 180 days; 0 keeps them
                    # (must be at least twice the lookback; findings and the audit log are never pruned)

data_dir: data         # state.json, audit.log (relative to this folder)
alerts_dir: alerts     # generated reports and calendar pages

http:
  user_agent: "cvewatch/1.0 (internal vulnerability monitor)"
  timeout: 30s
  retries: 3
  retry_delay: 2s
  rate: 1                       # requests per second, per host
  host_rates:                   # stricter limits for touchy hosts
    services.nvd.nist.gov: 0.1  # NVD allows ~5 requests / 30s without a key
    raw.githubusercontent.com: 5  # cve-records fetches one small file per new CVE (default)
  threshold_429: 3              # consecutive 429s before a host cooldown
  cooldown_429: 2m
  allow_private: false          # true permits http:// and internal addresses, e.g. an internal feed or proxy

slack:
  webhook_env: SLACK_WEBHOOK_URL  # the webhook itself stays in the environment
  min_severity: unknown           # unknown | low | medium | high | critical

# Scheduled refresh. A project picks its own period, or opts out, in its file:
#   update: {every: 1h, auto: false}
# auto: false below turns the schedule off for everything; then only
# `cvewatch update` and the F key in the TUI refresh.
# update:
#   auto: true       # default

# Lookups at outside services. cvss reads only public NVD data: it rates tracked
# CVEs that no feed gave a score (RSS and news items carry none), a few per cycle,
# and sends only the CVE id. epss asks FIRST for the exploit probability and
# reveals which CVEs you track, so it is off.
# enrich:
#   cvss: true       # default
#   epss: false      # default

# Optional access rules by actor name (CVEWATCH_ACTOR, else the OS user).
# Leave the section out for a single operator: everyone may do everything.
# This is authorization on top of a local identity, not authentication.
# access:
#   alice: {projects: [shop], write: true}
#   bob:   {projects: ["*"], write: false}

# A static status page (no scripts, no external requests) the daemon rewrites
# after every cycle. It lists your exposure: keep it where only your team reads.
# dashboard:
#   enabled: true
#   file: dashboard.html     # default: inside alerts_dir

# The full-screen interface (cvewatch tui).
# tui:
#   refresh: 30s     # how often it re-reads the state; at least 1s
#   auto: true       # without a running daemon, fetch on the project schedule
#   fetch: 0s        # a fixed period for everything instead of the schedule; 0 follows auto.
#   editor: nano     # the editor E opens files in, with options (code --wait).
#                    # Empty uses $VISUAL, $EDITOR, then the usual editors found.

# Alert horizon: only vulnerabilities published inside the window are judged,
# alerted and put in digests, like Google's time filter. Findings that exist
# stay. A project's `since` still applies; the later start wins. Items without
# a publication date are always inside. Keep lookback at least as long as the
# window, because a source's first run only reaches back to the lookback.
# horizon:
#   window: unlimited   # unlimited | hour | day | week | month | year | custom
#   from: 2026-01-01    # custom only: YYYY-MM-DD or RFC3339; empty means no start
#   to: ""              # custom only: YYYY-MM-DD (that whole day) or RFC3339; empty means no end
