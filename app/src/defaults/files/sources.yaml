# Feeds to poll. type: rss | hn | nvd | kev | ghsa | csaf | cve
# {since}, {since_date}, {since_unix}, {now} become the last successful fetch (or the lookback on first run).
sources:
  - id: cisa-kev
    type: kev
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  - id: nvd
    type: nvd
    url: https://services.nvd.nist.gov/rest/json/cves/2.0?pubStartDate={since}&pubEndDate={now}
    match_structured: true   # techs with CPE names match on NVD's product data, not on words in the description
    match_title_only: true   # techs without CPE names: read the title only (the first sentence names the product)
  - id: cve-records     # the CVE Program's own records: vendors such as Adobe, Cisco and Microsoft publish here first
    type: cve
    url: https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves/deltaLog.json
    match_title_only: true
  - id: ghsa
    type: ghsa
    url: https://api.github.com/advisories?per_page=100&type=reviewed&published=%3E%3D{since_date}
    auth_env: GITHUB_TOKEN   # without a token GitHub allows 60 requests an hour per IP; a token raises that to 5000 and needs no scopes for public advisories
  - id: hackernews
    type: hn
    url: https://hn.algolia.com/api/v1/search_by_date?query=CVE&tags=story&hitsPerPage=100&numericFilters=created_at_i%3E{since_unix}
  - id: thehackernews
    type: rss
    url: https://feeds.feedburner.com/TheHackersNews
  - id: bleepingcomputer
    type: rss
    url: https://www.bleepingcomputer.com/feed/
  - id: gitlab-security
    type: rss
    url: https://about.gitlab.com/security-releases.xml
  - id: nodejs-security
    type: rss
    url: https://nodejs.org/en/feed/vulnerability.xml
