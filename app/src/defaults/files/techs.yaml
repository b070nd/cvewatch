# Supported technologies. An item is relevant when its title or summary
# mentions an alias as a whole word. Edit freely: changes apply to items
# first seen from the next run on; earlier decisions are never rewritten
# (use `cvewatch rescan` to look back deliberately).
#
# Each entry has catalog metadata (title, category, vendor, source) so setup
# can offer it, plus how to recognise it in a repository (detect) and,
# for some vendors, an advisory feed that switches on with the technology.
# Entries are grouped by category; source says whether the code is open,
# closed or mixed (open core, source-available or open with a commercial edition).
#
# aliases: whole-word, case-insensitive matches in advisory text. Kept
# specific: a generic word ("go", "java", "windows") would match everything.
#
# excludes: if any of these words/phrases also appear, the item is about
# something built ON the tech (a WordPress plugin, a CMS), not the tech itself.
#
# cpe: "vendor:product" names from NVD's CPE data. When an NVD item carries
# product data, it decides the match and free text is ignored, which also
# gives version ranges. Every name here was checked against the NVD CPE
# dictionary and is listed in src/golden/testdata/cpe-known-good.txt: a wrong
# name hides real advisories. Without cpe, text decides.
#
# detect: files are marker file base names, images are container image
# repositories without registry or tag, packages are lockfile packages that
# imply the tech, versions say where its version can be read (a regular
# expression with exactly one capture group).
techs:
  # ---- languages ----
  - name: php
    title: PHP
    category: language
    vendor: The PHP Group
    source: open
    aliases: [php, php-fpm]
    excludes: [wordpress, drupal, joomla, typo3, prestashop, opencart, "plugin for", "theme for", "module for", "extension for"]
    cpe: [php:php]
    detect:
      files: [composer.json, composer.lock, php.ini, .php-version]
      images: [php]
      versions:
        - {file: .php-version, pattern: '^v?(\d+(?:\.\d+)*)'}
        - {file: .tool-versions, pattern: '(?m)^php\s+v?(\d+(?:\.\d+)*)'}
  - name: python
    title: Python
    category: language
    vendor: Python Software Foundation
    source: open
    aliases: [python, cpython]
    cpe: [python:python]
    detect:
      files: [requirements.txt, pyproject.toml, Pipfile, Pipfile.lock, poetry.lock, .python-version]
      images: [python]
      versions:
        - {file: .python-version, pattern: '^v?(\d+(?:\.\d+)*)'}
        - {file: .tool-versions, pattern: '(?m)^python\s+v?(\d+(?:\.\d+)*)'}
  - name: go
    title: Go
    category: language
    vendor: Google
    source: open
    aliases: [golang]
    cpe: [golang:go]
    detect:
      files: [go.mod, go.sum, go.work]
      images: [golang]
      versions:
        - {file: go.mod, pattern: '(?m)^go\s+v?(\d+(?:\.\d+)*)'}
        - {file: .tool-versions, pattern: '(?m)^golang\s+v?(\d+(?:\.\d+)*)'}
  - name: ruby
    title: Ruby
    category: language
    vendor: Ruby Core Team
    source: open
    aliases: [ruby, cruby]
    excludes: ["ruby on rails", rails, "ruby gem", rubygem, "gem for"]
    cpe: [ruby-lang:ruby]
    detect:
      files: [Gemfile, Gemfile.lock, .ruby-version]
      images: [ruby]
      versions:
        - {file: .ruby-version, pattern: '^(?:ruby-)?v?(\d+(?:\.\d+)*)'}
        - {file: .tool-versions, pattern: '(?m)^ruby\s+v?(\d+(?:\.\d+)*)'}
  - name: rust
    title: Rust
    category: language
    vendor: Rust Foundation
    source: open
    aliases: [rust, rustc, rust-lang]
    excludes: ["rust crate", "crate for", "written in rust"]
    cpe: [rust-lang:rust]
    detect:
      files: [Cargo.toml, Cargo.lock, rust-toolchain, rust-toolchain.toml]
      images: [rust]
      versions:
        - {file: rust-toolchain.toml, pattern: '(?m)^channel\s*=\s*"v?(\d+(?:\.\d+)*)"'}
        - {file: .tool-versions, pattern: '(?m)^rust\s+v?(\d+(?:\.\d+)*)'}
  - name: dotnet
    title: Microsoft .NET
    category: language
    vendor: Microsoft
    source: open
    aliases: [dotnet, ".net core", ".net framework", "microsoft .net", "asp.net core", "asp.net"]
    excludes: ["plugin for", "sdk for"]
    cpe: [microsoft:.net, microsoft:.net_core, microsoft:.net_framework, microsoft:asp.net_core]
    detect:
      files: [global.json, nuget.config, Directory.Build.props]
      images: [dotnet/sdk, dotnet/aspnet, dotnet/runtime, dotnet/runtime-deps]
      versions:
        - {file: global.json, pattern: '"version"\s*:\s*"(\d+(?:\.\d+)*)'}
    feeds:
      - {id: msrc, type: rss, url: "https://api.msrc.microsoft.com/update-guide/rss"}
  - name: openjdk
    title: Java (OpenJDK)
    category: language
    vendor: Eclipse Adoptium and OpenJDK community
    source: open
    aliases: [openjdk, "open jdk", "eclipse temurin", "amazon corretto"]
    cpe: [oracle:openjdk]
    detect:
      files: [.java-version, .sdkmanrc]
      images: [openjdk, eclipse-temurin, amazoncorretto]
      versions:
        - {file: .java-version, pattern: '^v?(\d+(?:\.\d+)*)'}
        - {file: .tool-versions, pattern: '(?m)^java\s+(?:[a-z]+-)*v?(\d+(?:\.\d+)*)'}
  - name: oracle-jdk
