# One project that runs every technology the shipped techs.yaml knows, with
# lockfiles for each ecosystem. Golden cases are judged against this stack.
name: stack
envs: [dev, prod]
techs:
  - {name: php, version: "8.2.10"}
  - {name: nodejs, version: "20.11.0"}
  - {name: nextjs, version: "14.0.1"}
  - {name: gitlab, version: "17.0.1"}
  - {name: elasticsearch, version: "8.11.1"}
  - {name: magento, version: "2.4.6"}
  - {name: nginx, version: "1.25.3"}
  - {name: redis, version: "7.2.3"}
  - {name: go, version: "1.22"}
  - {name: python, version: "3.11.4"}
lockfiles:
  - {type: composer, path: lock/composer.lock}
  - {type: npm, path: lock/package-lock.json}
  - {type: pip, path: lock/requirements.txt}
  - {type: gradle, path: lock/gradle.lockfile}
  - {type: go, path: lock/go.mod}
