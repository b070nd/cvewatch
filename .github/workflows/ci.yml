name: ci
on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  # The repository ruleset requires one check named "test". The matrix runs
  # under its own names and the "test" job below reports their combined result.
  platforms:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  test:
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.platforms.result }}" = "success"
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: app
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cvewatch:ci .
